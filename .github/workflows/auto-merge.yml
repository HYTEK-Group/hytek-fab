# Auto-merge: green merges itself, red blocks.
#
# WHY workflow_run instead of `gh pr merge --auto` at PR-open:
# This repo is PRIVATE on the GitHub FREE plan, where native auto-merge and
# branch protection / rulesets are unavailable (API returns 403). On an
# unprotected repo, `gh pr merge --auto` merges IMMEDIATELY (gh treats
# CLEAN/UNSTABLE as "mergeable now"), i.e. before tests finish. So instead we
# merge only AFTER the "PR tests" workflow completes successfully on the PR's
# current head commit. A red or still-running suite is never auto-merged; a
# stale success (PR got new commits meanwhile) no longer matches head and is
# skipped. If the org ever upgrades plans, add branch protection requiring the
# "tests" check and this file can revert to native auto-merge.
#
# TWO checks gate the merge, not one: "PR tests" (job `tests`) and "architecture"
# (job `architecture`). Either workflow finishing green wakes this one; the step
# below then asks the API for BOTH check-runs on the head commit and exits quietly
# unless both are `success`. So whichever finishes second does the merging, and a
# green tests run alone can no longer merge a PR that adds a side door.
# 23/09/2026: THREE gates, not two. "migrations" joined them — the check that
# applies a pull request's SQL to the staging database and runs the runner's
# own verify. Without it here, a pull request carrying a migration would
# auto-merge the moment tests and architecture went green, i.e. before
# anything had proved the SQL applies, and the live apply on merge would be
# the first attempt. The "migrations" check runs on EVERY pull request and
# passes immediately when there is no SQL in it, so nothing waits for a gate
# that never reports.
name: Auto-merge

on:
  workflow_run:
    workflows: ["PR tests", "architecture", "migrations"]
    types: [completed]

# `checks: read` is load-bearing: an explicit permissions block grants
# nothing it does not name, so without it the check-runs API below answers
# "Resource not accessible by integration (HTTP 403)" and this job goes
# GREEN having merged nothing. Measured on hytek-hub PR #637, 23/09/2026.
permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  merge-on-green:
    # Only merge when the tests run for a pull_request event ended green.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge the PR that just went green (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # BOTH required checks must be green on this exact commit. Whichever
          # workflow finishes second finds two successes here and merges; the
          # first one to finish exits quietly.
          JQ_BOTH='[.check_runs[] | select(.name=="tests" or .name=="architecture" or .name=="migrations") | .conclusion] | length==3 and all(.=="success")'
          # A FAILED CALL IS NOT "NOT READY YET". The gate below pipes the API into
          # a grep and treats anything else as "still waiting", so a 403 from a
          # missing permission reads exactly like a check that has not reported:
          # green job, nothing merged, nothing said. Measured on hytek-hub PR #637,
          # 23/09/2026. Prove the call works before believing its answer.
          gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs" --jq '.total_count' > /dev/null || {
            echo "::error title=Could not read the checks::The check-runs API did not answer, so whether the gates are green is unknown. Nothing was merged. This is a broken auto-merge, not a pull request waiting."
            exit 1
          }
          OK=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --jq "$JQ_BOTH")
          if [ "$OK" != "true" ]; then
            echo "Waiting for the other check — tests and architecture must both be green."
            exit 0
          fi
          # Find the open, non-draft PR whose CURRENT head is the commit that
          # passed. If the PR was pushed to since, there is no match and we
          # skip — the newer commit gets its own checks run + merge attempt.
          PR_NUMBER=$(gh pr list --repo "$REPO" --state open \
            --json number,isDraft,headRefOid \
            --jq ".[] | select(.headRefOid == \"$HEAD_SHA\" and (.isDraft | not)) | .number" | head -1)
          if [ -z "$PR_NUMBER" ]; then
            echo "No open non-draft PR with head $HEAD_SHA — nothing to merge."
            exit 0
          fi
          echo "Tests and architecture green on PR #$PR_NUMBER @ $HEAD_SHA — merging."
          gh pr merge --squash --repo "$REPO" "$PR_NUMBER"
