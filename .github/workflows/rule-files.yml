name: rule-files

# Rule files are the locks. A change to one is a deliberate act, not part of a
# task. This runs from the DEFAULT BRANCH (pull_request_target), so a pull
# request cannot disable it by editing this file.
#
# It fails when a pull request changes a protected path and the author is not
# the system owner. It never touches the pull request's code.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  rule-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check protected paths
        uses: actions/github-script@v7
        with:
          script: |
            const OWNER_LOGINS = ['scotttextor']
            const PROTECTED = [
              /^\.github\/workflows\//,
              /^tool\/architecture-check\.(ts|mjs|js)$/,
              /^scripts\/migrate\.mjs$/,
              /^policy\/claude-code\//,
              /\.contract\.test\.(ts|mjs|js)$/,
              /^CLAUDE\.md$/,
              /^CODEOWNERS$/,
              /^\.github\/CODEOWNERS$/,
            ]
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number, per_page: 100,
            })
            const hits = files.map(f => f.filename).filter(f => PROTECTED.some(re => re.test(f)))
            if (hits.length === 0) {
              core.info('No rule files touched.')
              return
            }
            const author = context.payload.pull_request.user.login
            if (OWNER_LOGINS.includes(author)) {
              core.info(`Rule files touched by the system owner (${author}): ${hits.join(', ')}`)
              return
            }
            core.setFailed([
              '',
              '⛔ BLOCKED — Rule 8: rule files are changed only with Scott\'s review',
              '',
              `What happened: this pull request changes ${hits.length} protected file(s):`,
              ...hits.map(h => `  - ${h}`),
              '',
              'Why it is blocked: these files ARE the locks — the checks, the migration',
              'runner, the Claude Code policy and the rulebook. Changing one to get a task',
              'done is how the structure was undone before.',
              '',
              'How to do it without breaking the rules:',
              '  • Take the rule-file changes out of this pull request; everything else can merge.',
              '  • If the rule itself is wrong, write it up for Scott with your recommended',
              '    answer. Rule changes are his.',
              '',
              'Paste this whole message into Claude Code and ask:',
              '  "How do I fix this without breaking the rules?"',
              '',
            ].join('\n'))
